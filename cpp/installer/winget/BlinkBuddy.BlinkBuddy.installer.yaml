# winget: how to install BlinkBuddy (the NSIS installer from the GitHub release). Before sending this to
# microsoft/winget-pkgs, fill in OWNER (the GitHub account) and the installer's SHA-256 (release.ps1 prints it), and
# check it with: winget validate --manifest cpp\installer\winget
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: BlinkBuddy.BlinkBuddy
PackageVersion: 1.0.0
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
InstallerSwitches:
  Custom: /VOICES=all
UpgradeBehavior: install
MinimumOSVersion: 10.0.17763.0
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/OWNER/BlinkBuddy/releases/download/v1.0.0/BlinkBuddy-1.0.0-setup.exe
    InstallerSha256: SHA256
ManifestType: installer
ManifestVersion: 1.6.0
