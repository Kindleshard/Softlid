# winget: how to install BlinkBuddy (the NSIS installers from the GitHub release). For a new version: the version
# numbers, the URLs and each installer's SHA-256 (release.ps1 prints them); check it with
# winget validate --manifest cpp\installer\winget
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: BlinkBuddy.BlinkBuddy
PackageVersion: 1.0.0
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
# (Unattended, the installer gives the spoken steps in the Windows language, the smallest install; an update keeps
# whatever was chosen before.)
UpgradeBehavior: install
MinimumOSVersion: 10.0.17763.0
# The uninstall entry the installer writes (HKCU\...\Uninstall\BlinkBuddy), so winget knows what's installed.
ProductCode: BlinkBuddy
AppsAndFeaturesEntries:
  - DisplayName: BlinkBuddy
    Publisher: BlinkBuddy
    DisplayVersion: 1.0.0
    ProductCode: BlinkBuddy
ReleaseDate: 2026-10-28
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Kindleshard/BlinkBuddy/releases/download/v1.0.0/BlinkBuddy-1.0.0-setup.exe
    InstallerSha256: F8E3C2BA8E3C9FC40ABA0E46B22AC84DF913EB78CDC5E3C296A00243271235EB
  - Architecture: arm64
    InstallerUrl: https://github.com/Kindleshard/BlinkBuddy/releases/download/v1.0.0/BlinkBuddy-1.0.0-arm64-setup.exe
    InstallerSha256: 13735A37D2C4D8490563A19E953892BFE9A47D1BCCA1822C2B3C9A27A7970985
ManifestType: installer
ManifestVersion: 1.12.0
