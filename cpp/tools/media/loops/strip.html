<!doctype html>
<!-- Reading strip: everything but the line you read dims, and the strip follows the pointer down the page (footage:
     record.ps1 strip). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../loop.css">
<script src="../motion.js"></script>
</head>
<body>
<div class="bg"></div>
<div class="glow" style="background:#2b6cff; left:520px; top:-140px; opacity:.32"></div>
<div class="glow" style="background:#f0c846; left:-220px; top:330px; opacity:.14"></div>
<div class="brand"><img src="../icon.png" alt="">BlinkBuddy</div>

<div class="caption">
  <div class="slot" id="c1">
    <div class="kicker">Reading strip</div>
    <div class="headline">Keep your place, line by line</div>
    <div class="body">Everything but the line you're reading dims softly, so your eyes don't wander.</div>
  </div>
  <div class="slot" id="c2">
    <div class="kicker">Reading strip</div>
    <div class="headline">It follows you down the page</div>
    <div class="body">With the pointer or the keyboard. A band, a column or a spotlight, in any tint.</div>
  </div>
</div>

<div class="stage"><div class="screen"><div class="view" id="view"><div class="sheen"></div></div></div></div>
<div class="dots"><i><b id="d1"></b></i><i><b id="d2"></b></i></div>

<script>
window.LOOP = { width: 960, height: 600, seconds: 9.6, footage: [{ name: 'strip', to: 9.4 }] };

// The strip comes on and moves down the notes a line or two at a time; then off, where the loop begins again. (The
// view holds still: a slow push-in would change every pixel of every frame and double the file.)
const notes = [0.3, 0.38];
const shots = [
    { name: 'strip', from: 0.2, to: 9.0, at: 0, until: 8.8, zoom: 1.35, focus: notes },
    { name: 'strip', from: 0.2, to: 0.2, at: 8.8, until: 9.6, fade: 0.7, zoom: 1.35, focus: notes },
];
const footage = new Footage(document.getElementById('view'));
const c1 = ['#c1 .kicker', '#c1 .headline', '#c1 .body'].map(s => new Words(document.querySelector(s)));
const c2 = ['#c2 .kicker', '#c2 .headline', '#c2 .body'].map(s => new Words(document.querySelector(s)));

function caption(lines, t, a, b) {
    lines.forEach((w, i) => w.set(M.span(t, a + 0.12 * i, a + 0.12 * i + 0.75), M.span(t, b - 0.5 + 0.06 * i, b + 0.06 * i)));
}

window.seek = async t => {
    caption(c1, t, 0.15, 4.7);
    caption(c2, t, 4.95, 9.35);
    document.getElementById('d1').style.transform = `scaleX(${M.span(t, 0, 4.8)})`;
    document.getElementById('d2').style.transform = `scaleX(${M.span(t, 4.8, 9.6)})`;
    await footage.show(t, shots);
};
</script>
</body>
</html>
